name: EAS Build (Android)

on:
  # Every merged pull request (any push to main) builds an installable preview APK.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  # Manual runs, e.g. for a production build.
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Manual runs use the chosen profile; automatic runs use preview.
      PROFILE: ${{ github.event.inputs.profile || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Link EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive --force

      - name: Build on EAS
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --wait | tee build.log

      - name: Show install link
        if: success()
        shell: bash
        run: |
          link=$(grep -oE 'https://expo\.dev/accounts/[^ ]+/builds/[0-9a-f-]+' build.log | tail -1)
          {
            echo "## 📱 Android build ready ($PROFILE)"
            echo
            if [ -n "$link" ]; then
              echo "**[Open this link on your phone to install]($link)**"
              echo
              echo "$link"
            else
              echo "Build finished. Find the install link at the end of the *Build on EAS* step's log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
